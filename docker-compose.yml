services:
  # 1. Discord bot
  discord-bot:
    build: .
    container_name: chihuahua-king-bot
    # entrypoint 需要先修正既有 volume 權限，之後會立即降權為 node。
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
